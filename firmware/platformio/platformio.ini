; PlatformIO project for the ATmega328P socket-based teaching platform.
; Each laboratory example is a separate environment. Build and upload, e.g.:
;   pio run -e 01-led-test -t upload
;   pio device monitor
; Upload: Arduino (Optiboot/Uno-compatible) bootloader over the CP2102 USB-to-UART adapter.

[platformio]
src_dir = examples
default_envs = 01-led-test

[env]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.mcu = atmega328p
board_build.f_cpu = 16000000L
upload_protocol = arduino
upload_speed = 115200
monitor_speed = 9600

[env:01-led-test]
build_src_filter = -<*> +<01-led-test/>

[env:02-e-logic-function]
build_src_filter = -<*> +<02-e-logic-function/>

[env:03-a-serial-sum]
build_src_filter = -<*> +<03-a-serial-sum/>

[env:03-b-serial-led]
build_src_filter = -<*> +<03-b-serial-led/>

[env:03-c-serial-thermostat]
build_src_filter = -<*> +<03-c-serial-thermostat/>

[env:03-d-serial-commands]
build_src_filter = -<*> +<03-d-serial-commands/>

[env:03-e-serial-stopwatch]
build_src_filter = -<*> +<03-e-serial-stopwatch/>

[env:03-f-serial-char-led]
build_src_filter = -<*> +<03-f-serial-char-led/>

[env:04-a-eeprom-led-state]
build_src_filter = -<*> +<04-a-eeprom-led-state/>

[env:04-b-eeprom-sos]
build_src_filter = -<*> +<04-b-eeprom-sos/>

[env:04-c-eeprom-counter]
build_src_filter = -<*> +<04-c-eeprom-counter/>

[env:05-a-button-polling]
build_src_filter = -<*> +<05-a-button-polling/>

[env:05-b-button-interrupt]
build_src_filter = -<*> +<05-b-button-interrupt/>

[env:05-c-timer-isr]
build_src_filter = -<*> +<05-c-timer-isr/>

[env:06-a-i2c-bme280]
build_src_filter = -<*> +<06-a-i2c-bme280/>
lib_deps =
	adafruit/Adafruit Unified Sensor@^1.1.6
	adafruit/Adafruit BME280 Library@^2.2.2

[env:06-b-i2c-scanner]
build_src_filter = -<*> +<06-b-i2c-scanner/>

[env:07-analog-ntc]
build_src_filter = -<*> +<07-analog-ntc/>

